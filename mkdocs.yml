site_name: Barry O'Callaghan
site_url: https://barryocallaghan.com/
site_description: Cybersecurity tools, research, and writeups.
repo_url: https://github.com/barry-oc/blog
repo_name: barry-oc/blog
copyright: Copyright &copy; 2026 Barry O'Callaghan

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.progress
    - toc.follow
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/giscus.js

plugins:
  - blog:
      blog_dir: blog
      blog_toc: true
      post_readtime: true
      post_readtime_words_per_minute: 200
      archive: true
      archive_date_format: MMMM yyyy
      categories: true
      categories_url_format: "category/{slug}"
      pagination: true
      pagination_per_page: 5
      authors_file: blog/.authors.yml
  - search
  - social:
      cards: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - footnotes

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
  - Projects: projects.md
  - Contact: contact.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/barry-oc
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/barryocallaghan/
  generator: false
