<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#155e75"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- edges: agent to targets -->
  <line x1="600" y1="200" x2="470" y2="130" stroke="#ffffff" stroke-opacity="0.30" stroke-width="5"/>
  <line x1="600" y1="200" x2="730" y2="120" stroke="#ffffff" stroke-opacity="0.30" stroke-width="5"/>
  <line x1="600" y1="200" x2="455" y2="270" stroke="#ffffff" stroke-opacity="0.30" stroke-width="5"/>
  <line x1="600" y1="200" x2="745" y2="280" stroke="#ffffff" stroke-opacity="0.30" stroke-width="5"/>
  <line x1="600" y1="200" x2="600" y2="80" stroke="#ffffff" stroke-opacity="0.30" stroke-width="5"/>
  <!-- target nodes -->
  <circle cx="470" cy="130" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="730" cy="120" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="455" cy="270" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="745" cy="280" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="600" cy="80" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <!-- central agent node -->
  <circle cx="600" cy="200" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6"/>
  <circle cx="600" cy="200" r="12" fill="#ffffff" fill-opacity="0.5"/>
</svg>
